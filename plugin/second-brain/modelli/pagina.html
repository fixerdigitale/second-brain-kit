<!doctype html>
<html lang="{{LINGUA}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITOLO}}</title>
<style>
:root{--sfondo:#fbfaf7;--testo:#1f2328;--tenue:#5b6470;--linea:#e3e0d8;--riquadro:#f2efe8;--accento:#2f6f5e;--codice:#efece4}
@media (prefers-color-scheme: dark){:root{--sfondo:#16181b;--testo:#e8e6e1;--tenue:#a3a9b1;--linea:#2c3036;--riquadro:#1e2125;--accento:#7cc4ad;--codice:#23272c}}
*{box-sizing:border-box}
body{margin:0;background:var(--sfondo);color:var(--testo);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:1.7rem;line-height:1.25;margin:0 0 1.2rem}
h2{font-size:1.2rem;margin:2.2rem 0 .6rem;padding-top:.8rem;border-top:1px solid var(--linea)}
h3{font-size:1.05rem;margin:1.4rem 0 .4rem;color:var(--accento)}
p,li{max-width:70ch}
ul,ol{padding-left:1.3rem}
li{margin:.25rem 0}
a{color:var(--accento)}
code{background:var(--codice);padding:.1em .35em;border-radius:4px;font-size:.9em;word-break:break-word}
pre{background:var(--codice);padding:12px;border-radius:6px;overflow-x:auto}
pre code{background:none;padding:0}
blockquote{margin:1rem 0;padding:.6rem 1rem;background:var(--riquadro);border-left:3px solid var(--accento)}
.tab{overflow-x:auto;margin:.8rem 0}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--linea);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--riquadro)}
footer{margin-top:3rem;color:var(--tenue);font-size:.85rem}
</style>
</head>
<body>
<main>
{{CONTENUTO}}
<footer>second-brain · file locale, resta sul tuo computer / local file, stays on your computer</footer>
</main>
</body>
</html>
