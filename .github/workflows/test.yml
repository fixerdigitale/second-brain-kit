name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # Keep LF line endings on Windows too: second-brain.sh and the generated
      # catalog files are compared byte by byte.
      - name: Keep line endings as in the repo
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run the tests
        run: python -m pytest

  plugin-validate:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No login and no API key: `claude plugin validate` works offline on the files.
      - name: Install Claude Code
        run: npm i -g @anthropic-ai/claude-code

      - name: Validate the marketplace
        run: claude plugin validate .

      - name: Validate the plugin
        run: claude plugin validate plugin/second-brain

      - name: Catalog index and numbers in the READMEs
        run: python plugin/second-brain/scripts/genera_indice_catalogo.py --controlla
