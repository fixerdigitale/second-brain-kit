<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title id="t">The second brain loop</title><desc id="d">Five steps in a circle around memory: capture, organize, find, use, learn. Every step reads from and writes to the same memory, a vault of notes.</desc>
<style>
.bg{fill:#ffffff}.box{fill:#f6f7f9;stroke:#c9ced6;stroke-width:1.5}.lab{fill:#1f2328;font-size:19px;font-weight:600}.sub{fill:#59636e;font-size:13px}
.core{fill:#eef4f1;stroke:#5b8a72;stroke-width:2}.corelab{fill:#2f5d47;font-size:21px;font-weight:700}.coresub{fill:#4d6b5c;font-size:13px}
.arr{stroke:#5b8a72;stroke-width:2;fill:none}.spoke{stroke:#aab3bd;stroke-width:1.3;stroke-dasharray:4 5;fill:none}.head{fill:#5b8a72}.num{fill:#5b8a72;font-size:12px;font-weight:700}
@media (prefers-color-scheme: dark){.bg{fill:#0d1117}.box{fill:#161b22;stroke:#3d444d}.lab{fill:#e6edf3}.sub{fill:#9198a1}
.core{fill:#13241c;stroke:#7fb89a}.corelab{fill:#a9d8bf}.coresub{fill:#8fb8a2}.arr{stroke:#7fb89a}.head{fill:#7fb89a}.spoke{stroke:#4a525c}.num{fill:#7fb89a}}
</style>
<rect class="bg" x="0" y="0" width="800" height="440" rx="14"/>
<defs><marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker></defs>
<line class="spoke" x1="400" y1="103" x2="400" y2="184"/>
<line class="spoke" x1="574" y1="196" x2="482" y2="213"/>
<line class="spoke" x1="522" y1="324" x2="454" y2="270"/>
<line class="spoke" x1="278" y1="324" x2="346" y2="270"/>
<line class="spoke" x1="226" y1="196" x2="318" y2="213"/>
<path class="arr" d="M482,102 Q560,102 584,144" marker-end="url(#m)"/>
<path class="arr" d="M645,217 Q649,274 586,319" marker-end="url(#m)"/>
<path class="arr" d="M469,357 Q400,391 331,357" marker-end="url(#m)"/>
<path class="arr" d="M214,319 Q151,274 155,217" marker-end="url(#m)"/>
<path class="arr" d="M216,144 Q240,102 318,102" marker-end="url(#m)"/>
<ellipse class="core" cx="400" cy="228" rx="80" ry="44"/>
<text class="corelab" x="400" y="226" text-anchor="middle">memory</text><text class="coresub" x="400" y="247" text-anchor="middle">one notes vault</text>
<rect class="box" x="312" y="37" width="176" height="62" rx="10"/>
<text class="num" x="324" y="55">1</text>
<text class="lab" x="400" y="65" text-anchor="middle">capture</text><text class="sub" x="400" y="85" text-anchor="middle">chats, calls, voice, notes</text>
<rect class="box" x="578" y="148" width="176" height="62" rx="10"/>
<text class="num" x="590" y="166">2</text>
<text class="lab" x="666" y="176" text-anchor="middle">organize</text><text class="sub" x="666" y="196" text-anchor="middle">fixed folders, tags</text>
<rect class="box" x="477" y="326" width="176" height="62" rx="10"/>
<text class="num" x="489" y="344">3</text>
<text class="lab" x="565" y="354" text-anchor="middle">find</text><text class="sub" x="565" y="374" text-anchor="middle">search, index, inventory</text>
<rect class="box" x="147" y="326" width="176" height="62" rx="10"/>
<text class="num" x="159" y="344">4</text>
<text class="lab" x="235" y="354" text-anchor="middle">use</text><text class="sub" x="235" y="374" text-anchor="middle">work, reports, decisions</text>
<rect class="box" x="46" y="148" width="176" height="62" rx="10"/>
<text class="num" x="58" y="166">5</text>
<text class="lab" x="134" y="176" text-anchor="middle">learn</text><text class="sub" x="134" y="196" text-anchor="middle">corrections → rules</text>
</svg>